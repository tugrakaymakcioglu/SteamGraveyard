[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "steam-graveyard"
version = "0.1.1"
description = "Discover delisted, removed & forgotten Steam games, hidden demos & DLCs. Fast local-first terminal TUI catalog with SteamDB links & official client actions."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Tugra Kaymakcioglu" },
]
keywords = [
  "steam",
  "delisted-games",
  "steamdb",
  "game-preservation",
  "abandonware",
  "textual",
  "tui",
  "terminal-app",
  "retro-gaming",
  "video-games",
  "steam-games",
  "steam-api",
  "catalog",
  "game-archaeology",
  "offline-first",
  "sqlite-fts5",
  "python-tui",
  "rich",
  "cli",
  "gaming-tools"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25.7,<26",
  "platformdirs>=4.5,<5",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "pyperclip>=1.9,<2",
  "rapidfuzz>=3.14,<4",
  "rich>=14.3,<16",
  "textual>=8.2,<9",
  "typer>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-pyperclip>=1.9,<2",
]

[project.scripts]
steam-graveyard = "steam_graveyard.cli.commands:app"

[project.urls]
Homepage = "https://github.com/tugrakaymakcioglu/SteamGraveyard"
Repository = "https://github.com/tugrakaymakcioglu/SteamGraveyard.git"
Issues = "https://github.com/tugrakaymakcioglu/SteamGraveyard/issues"
Changelog = "https://github.com/tugrakaymakcioglu/SteamGraveyard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["steam_graveyard"]

[tool.hatch.build]
include = [
  "steam_graveyard/**/*.py",
  "steam_graveyard/resources/*.json",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=steam_graveyard --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["steam_graveyard"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]
